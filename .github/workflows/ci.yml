name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: python -m compileall -q src/safety_backend
      - name: 依赖
        run: pip install pytest
      - name: 冒烟测试
        run: python -m pytest tests -q
